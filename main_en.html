:ring-blue-400 p-2 mb-4"> <label class="text-sm block font-medium mb-2 text-gray-700">Amount</label> <input type=number id=amount placeholder=₡5000 class="w-full rounded-xl border focus:outline-none focus:ring-2 focus:ring-blue-400 p-2 mb-4"> <label class="text-sm block font-medium mb-2 text-gray-700">Payment details</label> <input id=details placeholder=Dinner/Lunch/Pizza/Payment class="w-full rounded-xl border focus:outline-none focus:ring-2 focus:ring-blue-400 p-2 mb-6"> <button onclick=createSMS() class="w-full rounded-xl bg-blue-500 duration-200 font-semibold hover:bg-blue-600 py-2 text-white transition">Send SMS</button></main><footer class="text-sm mt-8 text-center text-gray-600"><p>&copy; <span id=year></span> ZharkaZ</p></footer><script src=assets/scripts/script.min.js defer=defer></script></body></html>
