<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINPEQR - Error</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

  <!-- LANGUAGE NAV -->
  <nav class="w-full p-4 bg-white shadow flex items-center justify-between">
    <div class="flex items-center gap-2">
      <img src="../assets/images/Logo(blue).svg" alt="Logo" class="h-8 w-8"/>
      <span class="text-lg font-bold text-blue-600">SINPE App</span>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-sm mt-10 text-center">
    <img src="../assets/images/error.gif" alt="Error"/>
    <p class="mt-4 text-red-600 font-semibold">Ocurrió un error al generar el mensaje.</p>
    <a href="/" class="mt-4 inline-block text-blue-600 hover:underline">Volver al inicio</a>
  </main>

  <!-- FOOTER -->
  <footer class="mt-8 text-gray-600 text-sm text-center">
    <p>&copy; <span id="year"></span> ZharkaZ</p>
  </footer>

  <!-- PROTECCIÓN -->
  <script>
    const allowed = sessionStorage.getItem("sms_error");
    if (!allowed) {
      window.location.href = "/";
    } else {
      sessionStorage.removeItem("sms_error");
    }

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
